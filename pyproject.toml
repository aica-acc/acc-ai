[project]
name = "acc_ai"
version = "0.1.0"
description = "Hackathon prototype with Instagram/YouTube crawling + LangGraph"
readme = "README.md"
requires-python = ">=3.11"

# 코드(app/)에서 실제로 import 하는 패키지만 둔다.
# 이미지/영상 생성은 외부 API(OpenAI, Replicate, Gemini) 로 처리하므로 GPU 라이브러리는 필요 없다.
dependencies = [
    # --- 이미지 ---
    "opencv-python-headless>=4.12.0.88",
    "pillow>=11.3.0",
    "cairosvg>=2.8.2",
    # --- HTTP / 크롤링 ---
    "requests>=2.32.3",
    "httpx>=0.28.1",
    "urllib3<2.0",
    "beautifulsoup4>=4.14.2",
    # --- YouTube API ---
    "google-api-python-client>=2.185.0",
    "google-auth>=2.41.1",
    # --- 환경변수 관리 ---
    "python-dotenv>=1.0.1",
    # --- LangChain / LangGraph ---
    "langchain>=0.3.27",
    "langchain-core>=0.3.79",
    "langchain-community>=0.3.31",
    "langchain-openai>=0.3.35",
    "langgraph>=1.0.0",
    # --- 데이터 ---
    "numpy>=2.2.6",
    "pandas>=2.3.3",
    "scikit-learn>=1.7.2",
    # --- 문장 임베딩 (축제 기획 분석, 마스코트) : torch 는 CPU 전용 빌드 ---
    "sentence-transformers>=5.1.2",
    "torch>=2.8.0,<2.9",
    # --- 웹 프레임워크 ---
    "fastapi>=0.119.0",
    "uvicorn>=0.37.0",
    "python-multipart>=0.0.20",
    # --- 외부 AI API ---
    "openai>=2.5.0",
    "google-genai>=1.52.0",
    "replicate>=1.0.7",
    # --- 문서 / 트렌드 / 검색 ---
    "pydantic>=2.12.3",
    "tqdm>=4.67.1",
    "rapidfuzz>=3.9.7",
    "PyMuPDF>=1.26.6",
    "python-docx>=1.2.0",
    "cloudconvert>=2.1.0",
    "pytrends>=4.9.2",
    "google-search-results>=2.4.2",
]

# torch 를 CPU 전용 빌드로 받는다 (CUDA 라이브러리 약 4.6GB 제외)
[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
